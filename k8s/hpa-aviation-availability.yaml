apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-aviation-availability
  namespace: var6
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aviation-availability
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 20
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
    scaleDown:
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
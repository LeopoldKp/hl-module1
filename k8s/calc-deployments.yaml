apiVersion: apps/v1
kind: Deployment
metadata:
  name: aviation-availability
  namespace: var6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aviation-availability
  template:
    metadata:
      labels:
        app: aviation-availability
    spec:
      containers:
        - name: aviation-availability
          image: leopoldpt/availability-service:lab18r
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
          envFrom:
            - configMapRef:
                name: aviation-config
            - secretRef:
                name: aviation-secrets
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "1Gi"
              cpu: "1"
            limits:
              memory: "1Gi"
              cpu: "1"
      imagePullSecrets:
        - name: dockerhub-secret
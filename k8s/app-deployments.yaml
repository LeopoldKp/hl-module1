apiVersion: apps/v1
kind: Deployment
metadata:
  name: aviation-main
  namespace: var6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aviation-main
  template:
    metadata:
      labels:
        app: aviation-main
    spec:
      hostAliases:
        - ip: "10.60.3.27"
          hostnames:
            - "hl22.zil"
        - ip: "10.60.3.28"
          hostnames:
            - "hl23.zil"
      containers:
        - name: aviation-main
          image: leopoldpt/aviation-crud-service:lab18r
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: aviation-config
            - secretRef:
                name: aviation-secrets
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "1Gi"
              cpu: "1"
            limits:
              memory: "1Gi"
              cpu: "1"
      imagePullSecrets:
        - name: dockerhub-secret
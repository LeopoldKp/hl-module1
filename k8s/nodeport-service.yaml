apiVersion: v1
kind: Service
metadata:
  name: aviation-main
  namespace: var6
spec:
  type: NodePort
  selector:
    app: aviation-main
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 32000
---
apiVersion: v1
kind: Service
metadata:
  name: aviation-availability
  namespace: var6
spec:
  type: NodePort
  selector:
    app: aviation-availability
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 32001
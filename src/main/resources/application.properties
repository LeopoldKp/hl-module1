# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.properties.hibernate.format_sql=false

# Tomcat
server.tomcat.max-threads=${SERVER_TOMCAT_MAX_THREADS}

# Flyway
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Jackson
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Observability
statistics.observability=true
observability.intervals=10,30,60
service.statistic.observability.delay=30000

# Kafka
kafka.hosts=${KAFKA_HOSTS:hl22.zil:9094,hl23.zil:9094}
kafka.groupId=${KAFKA_GROUP_ID:aviation-consumer-group}
kafka.topic=${KAFKA_TOPIC:var06}
kafka.concurrency=${KAFKA_CONCURRENCY:3}

# Batch settings
spring.kafka.listener.type=batch
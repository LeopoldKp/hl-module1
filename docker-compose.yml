version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: avia_postgres
    environment:
      POSTGRES_USER: avia_user
      POSTGRES_PASSWORD: avia_pass
      POSTGRES_DB: avia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: